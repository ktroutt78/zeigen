<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zeigen Review, lighter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0e0f12}
a{color:#a9acb3}a:hover{color:#f3f4f6}
button{font:inherit}
</style>
</helmet>
<div style="width: 100%; height: 900px; box-sizing: border-box; background: #0e0f12; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: 48px minmax(0, 1fr) 236px; gap: 8px; padding: 0 8px 8px; overflow: hidden">

  <!-- Title bar -->
  <div style="grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 12px">
    <div style="display: flex; gap: 8px" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-left: 8px">
      <span style="font-size: 14px; font-weight: 600">Tableau — Book1</span>
      <span style="font-size: 13px; color: #8b8e96">0:17</span>
    </div>
    <div style="flex-grow: 1"></div>
    <a href="#" style="font-size: 13px; text-decoration: none; padding: 8px 10px; border-radius: 8px">Recordings</a>
  </div>

  <!-- Preview -->
  <div style="grid-column: 1; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 28px 14px; min-height: 0; background: #17181c; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px">
    <div style="position: relative; width: 100%; max-width: 860px; aspect-ratio: 16 / 9; border-radius: 12px; background: #2a2d35; overflow: hidden; display: flex; align-items: center; justify-content: center">
      <!-- recorded window -->
      <div style="width: 84%; height: 82%; border-radius: 10px; background: #0f1115; box-shadow: 0 18px 50px rgba(0,0,0,0.45); display: flex; flex-direction: column; overflow: hidden">
        <div style="height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #181a1f" aria-hidden="true">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #3a3d45"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #3a3d45"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #3a3d45"></span>
        </div>
        <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 70px minmax(0, 1fr); gap: 12px; padding: 16px" aria-hidden="true">
          <div style="background: #1b1e24; border-radius: 8px"></div>
          <div style="background: #1b1e24; border-radius: 8px"></div>
          <div style="background: #1b1e24; border-radius: 8px"></div>
          <div style="grid-column: 1 / 4; background: #1b1e24; border-radius: 8px; display: flex; align-items: flex-end; gap: 10px; padding: 18px 22px">
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="12">
              <div style="flex-grow: 1; height: {{b.h}}%; background: #3b4a63; border-radius: 3px 3px 0 0"></div>
            </sc-for>
          </div>
        </div>
      </div>
      <!-- bubble -->
      <div style="position: absolute; right: 4%; bottom: 6%; width: 17%; aspect-ratio: 1 / 1; border-radius: 28%; background: #4a4f5a; box-shadow: 0 10px 28px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center">
        <svg width="40%" height="40%" viewBox="0 0 24 24" fill="none" stroke="#8b8e96" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      </div>
    </div>
    <!-- Playback controls, below the picture -->
    <div style="display: flex; align-items: center; gap: 18px">
      <span style="font-size: 12px; color: #8b8e96; font-family: ui-monospace, 'SF Mono', Menlo, monospace; min-width: 84px; text-align: right">0:09 / 0:17</span>
      <button aria-label="Back to start" style="width: 32px; height: 32px; border: 0; background: transparent; color: #a9acb3; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 5v14"></path><path d="M19 5 9 12l10 7z"></path></svg>
      </button>
      <button aria-label="Play" style="width: 40px; height: 40px; border: 0; background: #f3f4f6; color: #16171a; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
      </button>
      <button aria-label="Forward to end" style="width: 32px; height: 32px; border: 0; background: transparent; color: #a9acb3; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 5v14"></path><path d="M5 5l10 7-10 7z"></path></svg>
      </button>
      <button style="min-width: 84px; height: 32px; border: 0; background: transparent; color: #a9acb3; font-size: 12px; text-align: left; cursor: pointer">1×</button>
    </div>
  </div>

  <!-- Timeline -->
  <div style="grid-column: 1; grid-row: 3; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 6px; background: #17181c; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px">
    <div style="display: flex; align-items: center; gap: 10px; padding-left: 104px">
      <div style="flex-grow: 1; position: relative; height: 18px">
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #8b8e96; font-family: ui-monospace, 'SF Mono', Menlo, monospace">
          <span>0:00</span><span>0:02</span><span>0:04</span><span>0:06</span><span>0:08</span><span>0:10</span><span>0:12</span><span>0:14</span><span>0:16</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-left: 12px">
        <button aria-label="Zoom timeline out" style="width: 26px; height: 26px; border: 0; background: transparent; color: #8b8e96; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M8 11h6"></path><path d="m20 20-4-4"></path></svg>
        </button>
        <div style="position: relative; width: 72px; height: 2px; background: #33363d; border-radius: 2px" aria-hidden="true">
          <span style="position: absolute; left: 10%; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: #f3f4f6"></span>
        </div>
        <button aria-label="Zoom timeline in" style="width: 26px; height: 26px; border: 0; background: transparent; color: #8b8e96; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M8 11h6"></path><path d="M11 8v6"></path><path d="m20 20-4-4"></path></svg>
        </button>
        <button style="height: 26px; padding: 0 8px; border: 0; background: transparent; color: #a9acb3; font-size: 12px; border-radius: 6px; cursor: pointer">Fit</button>
      </div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 8px">
      <!-- Video row -->
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 140px; gap: 8px; align-items: center">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a9acb3">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="m16 10 5-3v10l-5-3"></path></svg>
          Video
        </div>
        <div style="position: relative; height: 44px; border-radius: 8px; background: rgba(255,255,255,0.04); display: flex; align-items: center; gap: 2px; padding: 0 12px; overflow: hidden">
          <sc-for list="{{wave}}" as="w" hint-placeholder-count="90">
            <span style="flex-grow: 1; height: {{w.h}}px; background: #6b7080; border-radius: 1px"></span>
          </sc-for>
          <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: oklch(0.60 0.17 252); border-radius: 8px 0 0 8px" aria-hidden="true"></span>
          <span style="position: absolute; right: 0; top: 0; bottom: 0; width: 5px; background: oklch(0.60 0.17 252); border-radius: 0 8px 8px 0" aria-hidden="true"></span>
        </div>
        <div></div>
      </div>
      <!-- Zoom row -->
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 140px; gap: 8px; align-items: center">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a9acb3">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          Zoom
        </div>
        <div style="position: relative; height: 44px; border-radius: 8px; background: rgba(255,255,255,0.04)">
          <div style="position: absolute; left: 5%; width: 17%; top: 4px; bottom: 4px; border-radius: 6px; background: oklch(0.66 0.17 300 / 0.22); display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: oklch(0.85 0.09 300); white-space: nowrap; overflow: hidden">pause + 2 clicks · 1.7×</div>
          <div style="position: absolute; left: 53%; width: 36%; top: 4px; bottom: 4px; border-radius: 6px; background: oklch(0.66 0.17 300 / 0.22); display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: oklch(0.85 0.09 300); white-space: nowrap; overflow: hidden">pause + 3 clicks · 1.7×</div>
        </div>
        <button style="height: 30px; border: 0; background: transparent; color: #a9acb3; font-size: 12px; border-radius: 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; justify-content: flex-start; padding: 0 8px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"></path></svg>
          Generate
        </button>
      </div>
      <!-- Scene row -->
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 140px; gap: 8px; align-items: center">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a9acb3">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="16" cy="14" r="2.5"></circle></svg>
          Scene
        </div>
        <div style="height: 44px; border-radius: 8px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #8b8e96">
          Switch layouts between your screen and camera ·
          <button style="border: 0; background: transparent; color: #f3f4f6; font-size: 12px; padding: 4px 2px; cursor: pointer">Add scene</button>
        </div>
        <div></div>
      </div>
      <!-- Playhead -->
      <div style="position: absolute; left: calc(104px + (100% - 104px - 148px) * 0.53); top: -26px; bottom: 0; width: 2px; background: #f3f4f6; border-radius: 1px" aria-hidden="true">
        <span style="position: absolute; top: -4px; left: -5px; width: 12px; height: 12px; border-radius: 50%; background: #f3f4f6"></span>
      </div>
    </div>
  </div>

  <!-- Right side: tool rail + panel -->
  <div style="grid-column: 2; grid-row: 2 / 4; display: flex; padding: 12px 16px 18px 6px; min-height: 0; background: #17181c; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px">
    <nav aria-label="Tools" style="width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px">
      <button aria-label="Zoom" style="width: 36px; height: 36px; border: 0; background: transparent; color: #8b8e96; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M11 8v6M8 11h6"></path><path d="m20 20-4-4"></path></svg>
      </button>
      <button aria-label="Cursor" aria-pressed="true" style="width: 36px; height: 36px; border: 0; background: rgba(255,255,255,0.08); color: #f3f4f6; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"></path></svg>
      </button>
      <button aria-label="Bubble" style="width: 36px; height: 36px; border: 0; background: transparent; color: #8b8e96; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="11" r="7"></circle><circle cx="12" cy="11" r="2.5"></circle><path d="M8 21h8"></path></svg>
      </button>
      <button aria-label="Blur" style="width: 36px; height: 36px; border: 0; background: transparent; color: #8b8e96; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"></path><path d="M4 4l16 16"></path></svg>
      </button>
      <button aria-label="Watermark" style="width: 36px; height: 36px; border: 0; background: transparent; color: #8b8e96; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 14V9a3 3 0 1 1 6 0v5"></path><path d="M5 14h14v3H5z"></path><path d="M6 20h12"></path></svg>
      </button>
      <button aria-label="Frame" style="width: 36px; height: 36px; border: 0; background: transparent; color: #8b8e96; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 3v18M17 3v18M3 7h18M3 17h18"></path></svg>
      </button>
      <button aria-label="Thumbnail" style="width: 36px; height: 36px; border: 0; background: transparent; color: #8b8e96; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
      </button>
    </nav>

    <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 8px 4px 0 16px; min-width: 0">
      <!-- Cursor settings -->
      <div style="display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Cursor</h2>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; color: #a9acb3">Smoothing</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255,255,255,0.05)">
            <button style="height: 30px; border: 0; border-radius: 6px; background: transparent; color: #a9acb3; font-size: 13px; cursor: pointer">Off</button>
            <button style="height: 30px; border: 0; border-radius: 6px; background: transparent; color: #a9acb3; font-size: 13px; cursor: pointer">Light</button>
            <button aria-pressed="true" style="height: 30px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.12); color: #f3f4f6; font-size: 13px; cursor: pointer">Smooth</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; font-size: 12px">
            <span style="color: #a9acb3">Size</span>
            <span style="color: #f3f4f6">1.70×</span>
          </div>
          <div style="position: relative; height: 2px; background: #33363d; border-radius: 2px" aria-hidden="true">
            <div style="width: 52%; height: 2px; background: {{accent}}; border-radius: 2px"></div>
            <span style="position: absolute; left: 52%; top: -6px; margin-left: -7px; width: 14px; height: 14px; border-radius: 50%; background: #f3f4f6"></span>
          </div>
        </div>
      </div>

      <div style="flex-grow: 1"></div>

      <!-- Export -->
      <div style="display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Export</h2>
        <div style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 10px 12px; align-items: center">
          <span style="font-size: 12px; color: #a9acb3">Format</span>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255,255,255,0.05)">
            <button aria-pressed="true" style="height: 28px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.12); color: #f3f4f6; font-size: 12px; cursor: pointer">MP4</button>
            <button style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: #a9acb3; font-size: 12px; cursor: pointer">GIF</button>
          </div>
          <span style="font-size: 12px; color: #a9acb3">Resolution</span>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255,255,255,0.05)">
            <button style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: #a9acb3; font-size: 12px; cursor: pointer">480p</button>
            <button style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: #a9acb3; font-size: 12px; cursor: pointer">720p</button>
            <button aria-pressed="true" style="height: 28px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.12); color: #f3f4f6; font-size: 12px; cursor: pointer">1080p</button>
            <button style="height: 28px; border: 0; border-radius: 6px; background: transparent; color: #a9acb3; font-size: 12px; cursor: pointer">Source</button>
          </div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center">
          <button style="flex-grow: 1; height: 36px; border: 0; border-radius: 8px; background: {{accent}}; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer">Save MP4</button>
          <button aria-label="Copy to clipboard" title="Copy to clipboard (⌘C)" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.06); color: #f3f4f6; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
          </button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <button style="border: 0; background: transparent; color: #a9acb3; font-size: 12px; padding: 6px 0; cursor: pointer">Record another</button>
          <button style="border: 0; background: transparent; color: #f08a80; font-size: 12px; padding: 6px 0; cursor: pointer">Discard</button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f74dc","options":["#2f74dc","#7c5cdb","#1f9d74","#e0763a"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const wave = [];
    let s = 7;
    for (let i = 0; i < 110; i++) {
      s = (s * 9301 + 49297) % 233280;
      const r = s / 233280;
      const quiet = (i > 18 && i < 26) || (i > 52 && i < 58) || i > 104;
      wave.push({ h: quiet ? 2 : Math.round(4 + r * 24) });
    }
    const bars = [38, 52, 46, 64, 58, 72, 61, 80, 74, 88, 69, 92].map((h) => ({ h }));
    return { accent: this.props.accent ?? '#2f74dc', wave, bars };
  }
}
</script>
</body>
</html>
